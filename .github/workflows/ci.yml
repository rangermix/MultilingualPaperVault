name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Repository and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: paper-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_DB_PORT: "55439"
      TEST_CPUS: "2"
    steps:
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Create isolated evidence directory
        run: mkdir -p .agent/tmp/ci/backend
      - name: Build locked test and check images
        run: |
          set -o pipefail
          docker compose --env-file .env.example -p "$COMPOSE_PROJECT_NAME" -f compose.example.yaml build checks tests 2>&1 | tee .agent/tmp/ci/backend/build.log
      - name: Check repository resources and boundaries
        run: |
          set -o pipefail
          docker compose --env-file .env.example -p "$COMPOSE_PROJECT_NAME" -f compose.example.yaml run --rm --no-deps checks 2>&1 | tee .agent/tmp/ci/backend/checks.log
      - name: Run Linux and PostgreSQL regressions
        run: |
          set -o pipefail
          docker compose --env-file .env.example -p "$COMPOSE_PROJECT_NAME" -f compose.example.yaml run --rm tests 2>&1 | tee .agent/tmp/ci/backend/pytest.log
      - name: Remove only the disposable test project
        if: always()
        run: docker compose --env-file .env.example -p "$COMPOSE_PROJECT_NAME" -f compose.example.yaml --profile tests down --volumes
      - name: Retain command evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent/tmp/ci/backend/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend and mocked browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBRARY_BROWSER_OUTPUT: .agent/tmp/ci/browser
    steps:
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - name: Create isolated evidence directory
        run: mkdir -p .agent/tmp/ci/frontend
      - name: Install locked frontend dependencies
        run: npm --prefix src/apps/web ci --ignore-scripts
      - name: Audit the locked dependency tree
        run: |
          set -o pipefail
          npm --prefix src/apps/web audit --audit-level=moderate 2>&1 | tee .agent/tmp/ci/frontend/audit.log
      - name: Run frontend unit tests
        run: |
          set -o pipefail
          npm --prefix src/apps/web test 2>&1 | tee .agent/tmp/ci/frontend/unit.log
      - name: Build the production frontend
        run: |
          set -o pipefail
          npm --prefix src/apps/web run build 2>&1 | tee .agent/tmp/ci/frontend/build.log
          test -s src/apps/web/dist/frontend-licenses.txt
      - name: Install Chromium for isolated browser tests
        run: node src/apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run mocked desktop and mobile browser flows
        run: |
          set -o pipefail
          node src/apps/web/node_modules/@playwright/test/cli.js test --config .github/playwright.smoke.config.mts 2>&1 | tee .agent/tmp/ci/frontend/browser.log
      - name: Retain command and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agent/tmp/ci/frontend/
            .agent/tmp/ci/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
