name: Feature request
description: Describe a user problem and proposed behavior.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the goal and a concrete use case within the project's personal PDF-library scope.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and alternatives
      description: Explain the observable result, alternatives, and any data compatibility, privacy, performance, model/backend, or deployment implications.
    validations:
      required: true
