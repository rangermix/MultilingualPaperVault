[project]
name = "bilingual-personal-pdf"
version = "0.1.0"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.163.1",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.9",
  "psycopg[binary]==3.3.9",
  "pydantic==2.14.3",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "pillow==13.0.0",
  "pypdf==7.1.0",
  "pypdfium2==5.15.2",
  "lxml==6.1.3",
  "markdown-it-py==4.3.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "pyyaml==6.0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".agent"]
cache_dir = ".agent/tmp/cache/pytest"
markers = [
  "postgres: requires a dedicated PostgreSQL test database",
  "live_provider: requires explicit budget and external processing authorization",
  "parser_container: runs the native parser child and requires a memory-bounded Linux container",
  "historical_evidence: replays archived independent evidence when the recorded corpus is available",
]

[tool.mypy]
cache_dir = ".agent/tmp/cache/mypy"

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
